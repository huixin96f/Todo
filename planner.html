<html lang="en">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f8;display:flex;min-height:100vh;font-size:13px;color:#1a1a2e}

/* ── LEFT ── */
#cal{flex:1;padding:24px 20px;overflow-y:auto;min-width:0}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:#1a1a2e}
.cal-sub{font-size:10px;font-weight:700;letter-spacing:2.5px;color:#adb5bd;text-transform:uppercase;margin-bottom:3px}
.nav-btns{display:flex;gap:6px}
.nav-btn{padding:6px 13px;border-radius:8px;border:1.5px solid #e2e4ea;background:#fff;font-size:14px;cursor:pointer;color:#495057;font-family:inherit}
.nav-btn:hover{background:#f8f9fa}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#555}
.leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}

/* Unified grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day-label{text-align:center;font-size:10px;font-weight:700;color:#ced4da;letter-spacing:.8px;padding:4px 0 6px;min-width:0;overflow:hidden}
.cell{min-height:82px;border-radius:10px;padding:7px 6px;background:#fff;border:1.5px solid #e9ecef;cursor:pointer;transition:box-shadow .12s,border-color .12s;min-width:0;overflow:hidden;width:100%}.cell:hover{box-shadow:0 2px 10px rgba(0,0,0,.09)}
.cell.today{background:#eef2ff;border:2px solid #3B5BDB;box-shadow:0 2px 12px rgba(59,91,219,.18)}
.cell.selected{outline:2.5px solid #3B5BDB;outline-offset:1px}
.cell.drag-over{border:2px dashed #3B5BDB !important;background:#f0f4ff !important}
.cell.today.drag-over{border:2px dashed #3B5BDB !important;background:#e0e7ff !important}
.cell-num{font-size:12px;font-weight:800;color:#343a40;margin-bottom:3px;pointer-events:none}
.cell.today .cell-num{color:#3B5BDB}
.ev-chip{font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none;display:block;width:100%;max-width:100%}
.ev-chip:active{cursor:grabbing}
.ev-chip.done{text-decoration:line-through;opacity:.7;cursor:default}
.more{font-size:9px;color:#adb5bd;margin-top:1px;pointer-events:none}
.cell.today .more{color:#748ffc}
.mini-stats{display:flex;gap:3px;margin-top:3px;pointer-events:none}
.stat-p{font-size:8px;background:#fff9db;color:#e67700;border-radius:3px;padding:1px 4px;font-weight:700}
.stat-d{font-size:8px;background:#d3f9d8;color:#2f9e44;border-radius:3px;padding:1px 4px;font-weight:700}

/* Day panel */
#day-panel{margin-top:14px;background:#fff;border-radius:14px;border:1.5px solid #e9ecef;padding:18px 20px;display:none}
#day-panel.open{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.panel-date{font-size:17px;font-weight:800;color:#1a1a2e}
.panel-weekday{font-size:10px;font-weight:700;letter-spacing:2px;color:#adb5bd;text-transform:uppercase;margin-bottom:3px}
.close-btn{background:none;border:1.5px solid #e9ecef;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:15px;color:#868e96;flex-shrink:0}

/* ev-card reorder insert indicator */
.ev-card{border-radius:10px;padding:11px 14px;margin-bottom:8px;border:1.5px solid transparent;cursor:grab;user-select:none;position:relative;transition:transform .1s}
.ev-card:active{cursor:grabbing}
.ev-card.reorder-above::before{content:'';position:absolute;top:-5px;left:0;right:0;height:3px;background:#3B5BDB;border-radius:2px}
.ev-card.reorder-below::after{content:'';position:absolute;bottom:-5px;left:0;right:0;height:3px;background:#3B5BDB;border-radius:2px}
.ev-card.drag-source{opacity:.4}

.ev-card-code{font-size:11px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ev-card-title{font-size:14px;font-weight:700;color:#212529;margin-bottom:3px}
.ev-card-title.done{text-decoration:line-through;opacity:.65}
.ev-card-note{font-size:12px;color:#495057;margin-top:2px}
.ev-card-done{font-size:11px;color:#2f9e44;margin-top:5px}
.badge{font-size:9px;font-weight:700;letter-spacing:.7px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.badge-p{background:#fff9db;color:#e67700;border:1px solid #ffe066}
.badge-d{background:#d3f9d8;color:#2f9e44;border:1px solid #8ce99a}
.empty-msg{font-size:13px;color:#adb5bd}
.reorder-hint{font-size:10px;color:#ced4da;text-align:center;margin-bottom:8px;letter-spacing:.3px}

/* ── RIGHT ── */
#right{width:300px;background:#fff;border-left:1.5px solid #e9ecef;display:flex;flex-direction:column;overflow-y:auto}
.section{padding:20px 16px;border-bottom:1.5px solid #e9ecef}
.section:last-child{border-bottom:none;flex:1}
.sec-label{font-size:9px;font-weight:800;letter-spacing:2.5px;color:#adb5bd;text-transform:uppercase;margin-bottom:2px}
.sec-title{font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:12px}
.drop-zone{min-height:40px;border-radius:10px;transition:background .15s,border .15s}
.drop-zone.drag-over{background:#f0f4ff;border:2px dashed #3B5BDB}
.pool-card{border-radius:10px;padding:9px 11px;margin-bottom:8px;border:1.5px solid transparent;cursor:grab;user-select:none}
.pool-card:active{cursor:grabbing}
.pool-card.done-card{border:1.5px solid #e9ecef!important;background:#f8f9fa!important;opacity:.55;cursor:default}
.pool-code{font-size:10px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.pool-title{font-size:13px;font-weight:600;color:#212529}
.pool-note{font-size:11px;color:#495057;margin-top:3px}
.done-title{font-size:11px;font-weight:700;color:#868e96;text-decoration:line-through}
.done-at{font-size:10px;color:#adb5bd;margin-top:2px}
.sec-divider{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#ced4da;text-transform:uppercase;margin:10px 0 6px}
.lt-card{border-radius:10px;border:1.5px solid #e9ecef;padding:10px 12px;margin-bottom:8px;cursor:grab;user-select:none}
.lt-card:active{cursor:grabbing}
.lt-title{font-size:13px;font-weight:600;color:#212529}
.lt-note{font-size:11px;color:#868e96;margin-top:3px}
.none-msg{font-size:12px;color:#ced4da;text-align:center;padding:10px 0}

/* Drag ghost */
.drag-ghost{position:fixed;pointer-events:none;opacity:.88;z-index:9999;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* Long-press activation pulse */
@keyframes dragPulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.drag-activating{animation:dragPulse .3s ease-in-out;}

/* ── MOBILE (portrait) ── */
@media (max-width:700px){
  body{flex-direction:column;font-size:12px}

  /* Calendar takes full width */
  #cal{padding:14px 10px;overflow-y:visible}
  .cal-header{margin-bottom:12px}
  .cal-title{font-size:17px}
  .cal-sub{font-size:9px}

  /* Nav: stack selects and arrows */
  .nav-btns{flex-wrap:wrap;gap:4px;justify-content:flex-end}
  #month-select,#year-select{font-size:12px;padding:5px 6px}
  .nav-btn{padding:5px 10px;font-size:13px}

  /* Smaller cells */
  .cell{min-height:52px;padding:4px 3px;border-radius:7px}
  .cell-num{font-size:11px;margin-bottom:1px}
  .ev-chip{font-size:7.5px;padding:1px 3px;margin-bottom:1px}
  .more{font-size:7.5px}
  .mini-stats{gap:2px;margin-top:2px}
  .stat-p,.stat-d{font-size:7px;padding:1px 3px}
  .day-label{font-size:9px;padding:2px 0 4px}
  .cal-grid{gap:2px}
  .legend{gap:6px;margin-bottom:10px}
  .leg-item{font-size:9px}

  /* Day panel full width */
  #day-panel{margin-top:10px;padding:14px 12px;border-radius:10px}
  .panel-date{font-size:15px}
  .ev-card{padding:9px 11px;margin-bottom:7px}
  .ev-card-title{font-size:13px}

  /* Right panel: full width below calendar, no side border */
  #right{width:100%;border-left:none;border-top:1.5px solid #e9ecef;flex-direction:column;overflow-y:visible}
  .section{padding:14px 12px}
  .sec-title{font-size:14px;margin-bottom:10px}

  /* Pool/lt cards slightly smaller */
  .pool-card{padding:8px 10px}
  .pool-title{font-size:12px}
  .pool-note{font-size:10px}
  .lt-card{padding:8px 10px}
  .lt-title{font-size:12px}
}
</style>

<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let curYear, curMonth, selectedDate=null;

/* ══════════════════════════════════════════════════════
   DRAG STATE
   mode: 'move'    — dragging to a different date/pool/lt
         'reorder' — dragging within the same day panel
   ══════════════════════════════════════════════════════ */
let drag = null;
/*  drag = {
      mode: 'move'|'reorder',
      code: string,
      source: 'events'|'pool'|'longterm',
      // reorder only:
      date: string,           // date of the day panel
      sourceEl: HTMLElement,  // the ev-card being dragged
      overEl: null|HTMLElement,
      overPos: 'above'|'below'|null
    }
*/

/* ── helpers ── */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,"0");}
function dateStr(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function catStyle(cat){return CAT[cat]||{color:"#868e96",light:"#f1f3f5"};}

/* Events for a date, sorted by order then code */
function eventsForDate(k){
  return EVENTS
    .filter(e=>e.date===k)
    .sort((a,b)=>{
      // Pending always before Done
      if(a.status!==b.status) return a.status==='Pending'?-1:1;
      // Within Pending: sort by order
      if(a.status==='Pending') return (a.order??99)-(b.order??99);
      // Within Done: sort by doneAt time
      return (a.doneAt||'').localeCompare(b.doneAt||'');
    });
}

/* Assign order to newly added events on a date */
function assignOrder(ev, date){
  const existing = EVENTS.filter(e=>e.date===date && e.status==='Pending' && e.code!==ev.code);
  const maxOrder = existing.length ? Math.max(...existing.map(e=>e.order??0)) : -1;
  ev.order = maxOrder + 1;
}

/* ═══════════════════════════════════════════════
   GHOST
   ═══════════════════════════════════════════════ */
function showGhost(e, item){
  const ghost = document.getElementById('drag-ghost');
  const c = catStyle(item.category||'');
  ghost.textContent = `${item.code||''} ${item.title}`.trim();
  ghost.style.background = c.light;
  ghost.style.color = c.color;
  ghost.style.border = `1.5px solid ${c.color}`;
  ghost.style.display = 'block';
  moveGhost(e);
}
function moveGhost(e){
  const ghost=document.getElementById('drag-ghost');
  const x=e.clientX||(e.touches&&e.touches[0].clientX)||0;
  const y=e.clientY||(e.touches&&e.touches[0].clientY)||0;
  ghost.style.left=(x+14)+'px';
  ghost.style.top=(y+14)+'px';
}
function hideGhost(){ document.getElementById('drag-ghost').style.display='none'; }

/* ═══════════════════════════════════════════════
   START DRAG
   ═══════════════════════════════════════════════ */
function startMoveDrag(e, code, source){
  e.stopPropagation();
  const item = findItem(code, source);
  if(!item) return;
  drag = {mode:'move', code, source};
  showGhost(e, item);
  bindDragListeners();
}

function startReorderDrag(e, code, date, cardEl){
  e.stopPropagation();
  const item = findItem(code, 'events');
  if(!item) return;
  drag = {mode:'reorder', code, source:'events', date, sourceEl:cardEl, overEl:null, overPos:null};
  cardEl.classList.add('drag-source');
  showGhost(e, item);
  bindDragListeners();
}

function bindDragListeners(){
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onEnd);
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend',  onTouchEnd);
}
function unbindDragListeners(){
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('mouseup',   onEnd);
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend',  onTouchEnd);
}

/* ═══════════════════════════════════════════════
   MOVE
   ═══════════════════════════════════════════════ */
function onMove(e){ moveGhost(e); if(drag.mode==='move') highlightMoveTarget(e); else highlightReorderTarget(e); }
function onTouchMove(e){ e.preventDefault(); onMove(e); }
function onEnd(e){ finish(e.clientX, e.clientY); }
function onTouchEnd(e){ const t=e.changedTouches[0]; finish(t.clientX, t.clientY); }

function xyFromEvent(e){
  return [e.clientX||(e.touches&&e.touches[0].clientX)||0,
          e.clientY||(e.touches&&e.touches[0].clientY)||0];
}

function highlightMoveTarget(e){
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const [x,y]=xyFromEvent(e);
  const el=document.elementFromPoint(x,y); if(!el) return;
  const cell=el.closest('.cell[data-date]');
  if(cell){cell.classList.add('drag-over');return;}
  const pd=el.closest('#pool-drop'); if(pd){pd.classList.add('drag-over');return;}
  const ld=el.closest('#lt-drop');   if(ld){ld.classList.add('drag-over');return;}
}

/* ═══════════════════════════════════════════════
   REORDER HIGHLIGHT
   Shows a blue line above or below the card being hovered
   ═══════════════════════════════════════════════ */
function highlightReorderTarget(e){
  // Clear previous indicators
  document.querySelectorAll('.reorder-above,.reorder-below').forEach(el=>{
    el.classList.remove('reorder-above','reorder-below');
  });

  const [x,y]=xyFromEvent(e);
  const el=document.elementFromPoint(x,y); if(!el) return;
  const card=el.closest('.ev-card[data-code]');
  if(!card || card===drag.sourceEl) return;

  // Above or below midpoint?
  const rect=card.getBoundingClientRect();
  const mid=rect.top+rect.height/2;
  const pos = y < mid ? 'above' : 'below';
  card.classList.add(pos==='above'?'reorder-above':'reorder-below');
  drag.overEl=card;
  drag.overPos=pos;
}

/* ═══════════════════════════════════════════════
   FINISH DROP
   ═══════════════════════════════════════════════ */
function finish(x, y){
  unbindDragListeners();
  hideGhost();
  document.querySelectorAll('.drag-over,.reorder-above,.reorder-below').forEach(el=>{
    el.classList.remove('drag-over','reorder-above','reorder-below');
  });
  if(!drag){return;}

  if(drag.mode==='reorder'){
    // Clean source highlight
    if(drag.sourceEl) drag.sourceEl.classList.remove('drag-source');
    if(drag.overEl && drag.overPos){
      applyReorder(drag.code, drag.date, drag.overEl.dataset.code, drag.overPos);
    }
    drag=null;
    // Re-render panel to show new order
    if(selectedDate) selectDay(selectedDate);
    renderCalendar();
    renderScheduled();
    return;
  }

  // mode === 'move'
  const el=document.elementFromPoint(x,y);
  if(!el){drag=null;return;}

  // First check: is this a reorder drop inside the panel on a card of the same date?
  const panelCard=el.closest('#panel-events .ev-card[data-code]');
  if(panelCard && drag.source==='events'){
    const targetCode=panelCard.dataset.code;
    const targetEv=EVENTS.find(e=>e.code===targetCode);
    const sourceEv=EVENTS.find(e=>e.code===drag.code);
    if(targetEv && sourceEv && targetEv.date===sourceEv.date && targetCode!==drag.code){
      const rect=panelCard.getBoundingClientRect();
      const pos=y<rect.top+rect.height/2?'above':'below';
      applyReorder(drag.code, sourceEv.date, targetCode, pos);
      drag=null;
      if(selectedDate) selectDay(selectedDate);
      renderCalendar();
      renderScheduled();
      return;
    }
  }

  const cell=el.closest('.cell[data-date]');
  if(cell){ dropOnDate(drag.code, drag.source, cell.dataset.date); drag=null; return; }
  if(el.closest('#pool-drop')){ dropOnPool(drag.code, drag.source); drag=null; return; }
  if(el.closest('#lt-drop'))  { dropOnLongterm(drag.code, drag.source); drag=null; return; }
  drag=null;
}

/* ═══════════════════════════════════════════════
   REORDER LOGIC
   Moves `dragCode` before or after `targetCode` within a date,
   then reassigns order values 0,1,2,…
   ═══════════════════════════════════════════════ */
function applyReorder(dragCode, date, targetCode, pos){
  const dayEvs = eventsForDate(date).filter(e=>e.status==='Pending');
  if(dayEvs.length<2) return;

  // Remove dragged item from list
  const dragIdx = dayEvs.findIndex(e=>e.code===dragCode);
  if(dragIdx===-1) return;
  const [dragged] = dayEvs.splice(dragIdx,1);

  // Find target position
  const targetIdx = dayEvs.findIndex(e=>e.code===targetCode);
  if(targetIdx===-1){ dayEvs.push(dragged); }
  else if(pos==='above'){ dayEvs.splice(targetIdx, 0, dragged); }
  else                  { dayEvs.splice(targetIdx+1, 0, dragged); }

  // Write new order values back to EVENTS array
  dayEvs.forEach((ev,i)=>{ ev.order=i; });
}

/* ═══════════════════════════════════════════════
   DROP ACTIONS (move between date/pool/lt)
   ═══════════════════════════════════════════════ */
function findItem(code, source){
  if(source==='events')  return EVENTS.find(e=>e.code===code);
  if(source==='pool')    return POOL.find(e=>e.code===code);
  if(source==='longterm')return LONGTERM.find(e=>e.title===code);
  return null;
}

function dropOnDate(code, source, targetDate){
  if(source==='events'){
    const ev=EVENTS.find(e=>e.code===code);
    if(!ev) return;
    if(ev.date===targetDate){drag=null;return;} // same cell, no-op
    ev.date=targetDate;
    assignOrder(ev, targetDate);
  } else if(source==='pool'){
    const idx=POOL.findIndex(e=>e.code===code); if(idx===-1) return;
    const [item]=POOL.splice(idx,1);
    item.date=targetDate;
    EVENTS.push(item);
    assignOrder(item, targetDate);
  } else if(source==='longterm'){
    return;
  }
  renderAll();
  if(selectedDate) selectDay(selectedDate);
}

function dropOnPool(code, source){
  if(source==='pool') return;
  if(source==='events'){
    const idx=EVENTS.findIndex(e=>e.code===code); if(idx===-1) return;
    const [item]=EVENTS.splice(idx,1);
    delete item.date; delete item.time; delete item.order;
    POOL.push(item);
    if(selectedDate) closePanel();
  } else if(source==='longterm'){
    return;
  }
  renderAll();
}

function dropOnLongterm(code, source){
  if(source==='longterm') return;
  if(source==='events'){
    const idx=EVENTS.findIndex(e=>e.code===code); if(idx===-1) return;
    const [item]=EVENTS.splice(idx,1);
    delete item.date; delete item.time; delete item.order; delete item.code; delete item.category;
    LONGTERM.push(item);
    if(selectedDate) closePanel();
  } else if(source==='pool'){
    const idx=POOL.findIndex(e=>e.code===code); if(idx===-1) return;
    const [item]=POOL.splice(idx,1);
    delete item.code; delete item.category;
    LONGTERM.push(item);
  }
  renderAll();
}

/* ── attach drag to an element ──
   Desktop: mousedown fires immediately.
   Mobile:  touchstart starts a 300ms timer. If the finger moves >6px
            before the timer fires, we cancel → native scroll takes over.
            If the timer fires first → drag activates (visual pulse feedback).
*/
const LONG_PRESS_MS = 300;
const LONG_PRESS_SLOP = 6; // px movement allowed before cancelling

function addLongPressDrag(el, onActivate){
  let timer = null;
  let startX = 0, startY = 0;

  function cancel(){
    clearTimeout(timer);
    timer = null;
    el.classList.remove('drag-activating');
  }

  el.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    el.classList.add('drag-activating');
    timer = setTimeout(()=>{
      el.classList.remove('drag-activating');
      // Synthesize an event-like object for ghost positioning
      onActivate(e);
    }, LONG_PRESS_MS);
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    if(!timer) return;
    const t = e.touches[0];
    const dx = Math.abs(t.clientX - startX);
    const dy = Math.abs(t.clientY - startY);
    if(dx > LONG_PRESS_SLOP || dy > LONG_PRESS_SLOP) cancel();
  }, {passive:true});

  el.addEventListener('touchend',   cancel);
  el.addEventListener('touchcancel',cancel);
}

function makeDraggable(el, code, source){
  el.addEventListener('mousedown', e=>{ if(e.button!==0) return; startMoveDrag(e,code,source); });
  addLongPressDrag(el, e=>{ startMoveDrag(e,code,source); });
}
function makeReorderable(el, code, date){
  el.addEventListener('mousedown', e=>{ if(e.button!==0) return; startReorderDrag(e,code,date,el); });
  addLongPressDrag(el, e=>{ startReorderDrag(e,code,date,el); });
}

/* ══════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════ */
function buildLegend(){
  const el=document.getElementById("legend");
  Object.entries(CAT).forEach(([k,v])=>{
    el.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="background:${v.color}"></div><span style="font-weight:700;color:${v.color}">${k[0]}</span>&nbsp;${k}</div>`;
  });
}

function renderCalendar(){
  const today=todayStr();
  document.getElementById("month-title").textContent=`${MONTHS[curMonth]} ${curYear}`;
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const totalDays=new Date(curYear,curMonth+1,0).getDate();
  const grid=document.getElementById("cal-grid");
  while(grid.children.length>7) grid.removeChild(grid.lastChild);
  for(let i=0;i<firstDay;i++) grid.appendChild(document.createElement("div"));
  for(let d=1;d<=totalDays;d++){
    const key=dateStr(curYear,curMonth,d);
    const dayEvs=eventsForDate(key);
    const isToday=key===today, isSel=key===selectedDate;
    const pending=dayEvs.filter(e=>e.status==="Pending").length;
    const done=dayEvs.filter(e=>e.status==="Done").length;
    const cell=document.createElement("div");
    cell.className=`cell${isToday?" today":""}${isSel?" selected":""}`;
    cell.dataset.date=key;
    cell.addEventListener('click',()=>{ if(!drag) selectDay(key); });
    const numEl=document.createElement("div");
    numEl.className="cell-num"; numEl.textContent=d; cell.appendChild(numEl);
    dayEvs.slice(0,3).forEach(ev=>{
      const c=catStyle(ev.category);
      const chip=document.createElement("div");
      chip.className=`ev-chip${ev.status==='Done'?' done':''}`;
      chip.style.background=c.light;
      chip.style.color=c.color;
      chip.innerHTML=`<span style="opacity:.75">${ev.code}</span> ${ev.time?`<span style="opacity:.65">${ev.time}</span> `:""}${ev.title}`;
      if(ev.status!=='Done') makeDraggable(chip, ev.code, 'events');
      cell.appendChild(chip);
    });
    if(dayEvs.length>3){ const m=document.createElement("div"); m.className="more"; m.textContent=`+${dayEvs.length-3} more`; cell.appendChild(m); }
    if(dayEvs.length>0){ const s=document.createElement("div"); s.className="mini-stats"; s.innerHTML=`${pending>0?`<span class="stat-p">${pending}P</span>`:""}${done>0?`<span class="stat-d">${done}D</span>`:""}`;  cell.appendChild(s); }
    grid.appendChild(cell);
  }
}

function renderScheduled(){
  const upcoming=EVENTS
    .filter(e=>e.status==="Pending" && e.date && e.date!==selectedDate)
    .slice().sort((a,b)=>a.date.localeCompare(b.date)||((a.order??99)-(b.order??99)));
  const container=document.getElementById("scheduled-list");
  container.innerHTML="";
  if(upcoming.length===0){ container.innerHTML=`<div class="none-msg">Nothing scheduled.</div>`; return; }
  upcoming.forEach(ev=>{
    const c=catStyle(ev.category);
    const card=document.createElement("div");
    card.className="pool-card";
    card.style.background=c.light; card.style.borderLeft=`4px solid ${c.color}`;
    const dt=new Date(ev.date+"T12:00:00");
    const dateLabel=dt.toLocaleDateString(undefined,{month:"short",day:"numeric",weekday:"short"});
    card.innerHTML=`<div class="pool-code"><span style="font-weight:800;color:${c.color}">${ev.code}</span><span class="badge badge-p">Pending</span><span style="font-size:10px;color:#868e96;margin-left:auto">${dateLabel}</span></div><div class="pool-title">${ev.title}</div>${ev.note?`<div class="pool-note">${ev.note}</div>`:""}`;
    makeDraggable(card, ev.code, 'events');
    container.appendChild(card);
  });
}

function renderPool(){
  const pending=POOL.filter(e=>e.status==="Pending");
  const done=POOL.filter(e=>e.status==="Done");
  const pendingEl=document.getElementById("pool-pending"); pendingEl.innerHTML="";
  if(pending.length===0){ pendingEl.innerHTML=`<div class="none-msg">Pool is empty.</div>`; }
  else{ pending.forEach(ev=>{ const c=catStyle(ev.category); const card=document.createElement("div"); card.className="pool-card"; card.style.background=c.light; card.style.borderLeft=`4px solid ${c.color}`; card.innerHTML=`<div class="pool-code"><span style="font-weight:800;color:${c.color}">${ev.code}</span><span class="badge badge-p">Pending</span></div><div class="pool-title">${ev.title}</div>${ev.note?`<div class="pool-note">${ev.note}</div>`:""}`;  makeDraggable(card,ev.code,'pool'); pendingEl.appendChild(card); }); }
  const doneWrap=document.getElementById("pool-done-wrap");
  if(done.length>0){ let dh=""; done.forEach(ev=>{dh+=`<div class="pool-card done-card"><div class="done-title">${ev.code} ${ev.title}</div>${ev.doneAt?`<div class="done-at">Done ${ev.doneAt}</div>`:""}</div>`;}); document.getElementById("pool-done").innerHTML=dh; doneWrap.style.display="block"; } else { doneWrap.style.display="none"; }
}

function renderLongterm(){
  const pending=LONGTERM.filter(t=>t.status==="Pending");
  const done=LONGTERM.filter(t=>t.status==="Done");
  const pendingEl=document.getElementById("lt-pending"); pendingEl.innerHTML="";
  if(pending.length===0){ pendingEl.innerHTML=`<div class="none-msg">Nothing here yet.</div>`; }
  else{ pending.forEach(t=>{ const card=document.createElement("div"); card.className="lt-card"; card.innerHTML=`<div class="lt-title">${t.title}</div>${t.note?`<div class="lt-note">${t.note}</div>`:""}`;  makeDraggable(card,t.title,'longterm'); pendingEl.appendChild(card); }); }
  const doneWrap=document.getElementById("lt-done-wrap");
  if(done.length>0){ let dh=""; done.forEach(t=>{dh+=`<div class="pool-card done-card"><div class="done-title">${t.title}</div>${t.doneAt?`<div class="done-at">Done ${t.doneAt}</div>`:""}</div>`;}); document.getElementById("lt-done").innerHTML=dh; doneWrap.style.display="block"; } else { doneWrap.style.display="none"; }
}

function renderAll(){ renderCalendar(); renderScheduled(); renderPool(); renderLongterm(); }

/* ── Day panel ── */
function selectDay(key){
  selectedDate=key; renderCalendar(); renderScheduled();
  const dt=new Date(key+"T12:00:00");
  document.getElementById("panel-weekday").textContent=WEEKDAYS[dt.getDay()];
  document.getElementById("panel-date").textContent=dt.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  const dayEvs=eventsForDate(key);
  const panelEvents=document.getElementById("panel-events"); panelEvents.innerHTML="";

  const pending=dayEvs.filter(e=>e.status==='Pending');
  const done=dayEvs.filter(e=>e.status==='Done');

  if(dayEvs.length===0){
    panelEvents.innerHTML=`<div class="empty-msg">No events on this day.</div>`;
  } else {
    // ── Pending section ──
    if(pending.length===0){
      panelEvents.innerHTML=`<div class="empty-msg">No pending tasks.</div>`;
    } else {
      if(pending.length>1){
        const hint=document.createElement("div");
        hint.className="reorder-hint";
        hint.textContent="↕ Drag cards to reorder priority";
        panelEvents.appendChild(hint);
      }
      pending.forEach(ev=>{
        const c=catStyle(ev.category);
        const card=document.createElement("div");
        card.className="ev-card";
        card.dataset.code=ev.code;
        card.style.background=c.light;
        card.style.borderLeft=`4px solid ${c.color}`;
        card.innerHTML=`
          <div class="ev-card-code">
            <span style="font-size:11px;font-weight:800;color:${c.color}">${ev.code}</span>
            <span class="badge badge-p">Pending</span>
            <span style="font-size:10px;color:#868e96">${ev.category}</span>
            ${ev.time?`<span style="font-size:11px;color:#495057;margin-left:auto">${ev.time}</span>`:""}
          </div>
          <div class="ev-card-title">${ev.title}</div>
          ${ev.note?`<div class="ev-card-note">${ev.note}</div>`:""}
        `;
        makeReorderable(card, ev.code, key);
        panelEvents.appendChild(card);
      });
    }

    // ── Done section ──
    if(done.length>0){
      const divider=document.createElement("div");
      divider.style.cssText="margin:16px 0 10px;display:flex;align-items:center;gap:8px";
      divider.innerHTML=`
        <div style="flex:1;height:1px;background:#e9ecef"></div>
        <span style="font-size:9px;font-weight:800;letter-spacing:2px;color:#adb5bd;text-transform:uppercase">已完成 ${done.length}</span>
        <div style="flex:1;height:1px;background:#e9ecef"></div>
      `;
      panelEvents.appendChild(divider);
      done.forEach(ev=>{
        const c=catStyle(ev.category);
        const card=document.createElement("div");
        card.className="ev-card";
        card.dataset.code=ev.code;
        card.style.background="#f8f9fa";
        card.style.borderLeft=`4px solid #ced4da`;
        card.style.opacity="0.7";
        card.innerHTML=`
          <div class="ev-card-code">
            <span style="font-size:11px;font-weight:800;color:#868e96">${ev.code}</span>
            <span class="badge badge-d">Done</span>
            <span style="font-size:10px;color:#adb5bd">${ev.category}</span>
          </div>
          <div class="ev-card-title done">${ev.title}</div>
          ${ev.doneAt?`<div class="ev-card-done">✓ ${ev.doneAt}</div>`:""}
        `;
        panelEvents.appendChild(card);
      });
    }
  }
  document.getElementById("day-panel").classList.add("open");
}

function closePanel(){ selectedDate=null; document.getElementById("day-panel").classList.remove("open"); renderCalendar(); renderScheduled(); }

function changeMonth(dir){
  curMonth+=dir;
  if(curMonth<0){curMonth=11;curYear--;}
  if(curMonth>11){curMonth=0;curYear++;}
  syncSelectors();
  renderAll();
}

function onMonthSelect(){
  curMonth=parseInt(document.getElementById("month-select").value);
  curYear=parseInt(document.getElementById("year-select").value);
  renderAll();
}

function syncSelectors(){
  document.getElementById("month-select").value=curMonth;
  document.getElementById("year-select").value=curYear;
}

function buildSelectors(){
  const mSel=document.getElementById("month-select");
  MONTHS.forEach((m,i)=>{
    const o=document.createElement("option");
    o.value=i; o.textContent=m; mSel.appendChild(o);
  });
  const ySel=document.getElementById("year-select");
  const thisYear=new Date().getFullYear();
  for(let y=thisYear-1;y<=thisYear+3;y++){
    const o=document.createElement("option");
    o.value=y; o.textContent=y; ySel.appendChild(o);
  }
}

(function init(){
  const now=new Date(); curYear=now.getFullYear(); curMonth=now.getMonth();
  buildLegend();
  buildSelectors();
  syncSelectors();
  renderAll();

  /* ── Auto-select today's date on load ── */
  const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  selectDay(todayKey);

  /* ── Swipe left/right on calendar to change month ── */
  const calEl = document.getElementById('cal');
  let swipeStartX = null;
  let swipeStartY = null;
  const SWIPE_MIN_X = 50;   // minimum horizontal px to count as a swipe
  const SWIPE_MAX_Y = 80;   // maximum vertical px drift allowed

  calEl.addEventListener('touchstart', e=>{
    // Only track single-finger touches not on a draggable card
    if(e.touches.length !== 1) return;
    if(e.target.closest('.ev-chip, .ev-card, .pool-card, .lt-card')) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, {passive:true});

  calEl.addEventListener('touchend', e=>{
    if(swipeStartX === null) return;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - swipeStartY);
    swipeStartX = null;
    swipeStartY = null;
    // Must be more horizontal than vertical, and exceed min distance
    if(dy > SWIPE_MAX_Y) return;
    if(Math.abs(dx) < SWIPE_MIN_X) return;
    changeMonth(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
</script>
